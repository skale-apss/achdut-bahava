version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: achdut_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-achdut_bahava}
      MYSQL_USER: ${DB_USER:-wp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wp_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - achdut_net

  wordpress:
    image: wordpress:6.5-php8.2-apache
    container_name: achdut_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-achdut_bahava}
      WORDPRESS_DB_USER: ${DB_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wp_password}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-abwp_}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_SITEURL', '${SITE_URL:-http://localhost:8080}');
        define('WP_HOME', '${SITE_URL:-http://localhost:8080}');
        define('WPLANG', 'he_IL');
        define('WP_POST_REVISIONS', 5);
        define('AUTOSAVE_INTERVAL', 120);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - ./wordpress/wp-content:/var/www/html/wp-content
    ports:
      - "8080:80"
    networks:
      - achdut_net

  wpcli:
    image: wordpress:cli-php8.2
    container_name: achdut_wpcli
    depends_on:
      - wordpress
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-achdut_bahava}
      WORDPRESS_DB_USER: ${DB_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wp_password}
    volumes:
      - ./wordpress/wp-content:/var/www/html/wp-content
      - ./scripts:/scripts
    working_dir: /var/www/html
    user: "33:33"
    entrypoint: /bin/sh
    networks:
      - achdut_net
    profiles:
      - tools

volumes:
  db_data:

networks:
  achdut_net:
    driver: bridge
